:root{
  --ac-accent:226 39 29; --ac-accent-strong:185 28 20; --ac-accent-text:200 30 22;
  --ac-bg:245 245 245; --ac-surface:255 255 255; --ac-raised:240 240 240; --ac-border:229 229 229;
  --ac-ink:17 17 17; --ac-ok:5 150 105; --ac-ok-text:4 120 87; --ac-muted:94 97 104;
  --ac-gutter:clamp(16px,2.8vw,56px);
  --hdr:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;background:#fff;color:rgb(var(--ac-ink));font-family:Montserrat,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{position:fixed;inset:0 0 auto 0;z-index:20;background:rgb(var(--ac-surface));border-bottom:1px solid rgb(var(--ac-border))}
.ac-util{height:30px;background:#111;color:#d3d4d7;display:flex;align-items:center;justify-content:space-between;padding:0 var(--ac-gutter);font:500 11.5px "IBM Plex Mono",monospace;letter-spacing:.04em}
.ac-util b{color:#fff;font-weight:600}
.ac-bar{height:66px;display:flex;align-items:center;gap:14px;padding:0 var(--ac-gutter)}
.ac-bar .lg{height:30px;width:auto}
.ac-name{display:flex;flex-direction:column;line-height:1}
.ac-name strong{font-weight:800;font-size:22px;letter-spacing:-.03em}
.ac-name strong em{font-style:normal;color:rgb(var(--ac-accent-text))}
.ac-name small{font:400 11px "IBM Plex Mono",monospace;color:rgb(var(--ac-muted));margin-top:4px}
.sp{flex:1}
#mode-pills{display:flex;margin-left:18px;padding:3px;border-radius:999px;border:1px solid rgb(var(--ac-border));background:rgb(var(--ac-bg))}
#mode-pills button{height:36px;padding:0 18px;border:0;border-radius:999px;background:transparent;font:600 13px Montserrat,sans-serif;color:rgb(var(--ac-muted));cursor:pointer}
#mode-pills button.on{background:#111;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid rgb(var(--ac-border));background:rgb(var(--ac-surface));color:rgb(var(--ac-ink));font:600 13px Montserrat,sans-serif;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:rgb(var(--ac-raised))}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.on{background:#111;border-color:#111;color:#fff}
#btn-pause.on{background:rgb(var(--ac-accent));border-color:rgb(var(--ac-accent));color:#fff}

#scene{position:fixed;left:0;top:var(--hdr);width:100vw;height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr));display:block;touch-action:pan-y;z-index:1;opacity:0;transition:opacity .8s}
body.ready #scene{opacity:1}
body.paused #scene{touch-action:none;cursor:grab}
body.paused #scene:active{cursor:grabbing}
#spacer{height:3200vh}
#labels{position:fixed;left:0;top:var(--hdr);width:100vw;height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr));pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transition:opacity .35s;display:flex;align-items:center;gap:0;white-space:nowrap}
.lbl i{width:9px;height:9px;border-radius:50%;background:rgb(var(--ac-accent));box-shadow:0 0 0 4px rgb(var(--ac-accent)/.18);transform:translate(-50%,0);flex:none}
.lbl.ok i{background:rgb(var(--ac-ok));box-shadow:0 0 0 4px rgb(var(--ac-ok)/.2)}
.lbl.ok span{background:rgb(var(--ac-ok-text))}
.lbl.plain i{display:none}
.lbl.plain span{background:rgb(var(--ac-accent));margin-left:0}
.lbl span{margin-left:8px;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;background:#111;color:#fff;padding:5px 10px;border-radius:999px}

/* tarjeta de etapa */
#stage-card{position:fixed;z-index:10;left:var(--ac-gutter);bottom:calc(var(--ac-gutter) + 26px);width:min(400px,calc(100vw - 2*var(--ac-gutter)));
  background:rgb(var(--ac-surface)/.92);backdrop-filter:blur(10px);border:1px solid rgb(var(--ac-border));border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}
#stage-card.in{animation:cin .5s ease both}
body.shot .lbl,body.shot #scene{transition:none!important}body.shot #stage-card.in{animation:none}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#st-kicker{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.08em;color:rgb(var(--ac-accent-text))}
#st-title{font-weight:800;font-size:clamp(26px,2.6vw,38px);letter-spacing:-.04em;line-height:1.02}
#st-text{color:rgb(var(--ac-muted));line-height:1.55;font-size:14.5px}
#st-data:empty{display:none}
#st-data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.mini{background:rgb(var(--ac-bg));border-radius:16px;padding:12px 12px 10px}
.mini b{display:block;font-weight:800;font-size:24px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.mini span{display:block;font-size:11.5px;color:rgb(var(--ac-muted));margin-top:6px}

/* menú de etapas */
#menu{position:fixed;z-index:10;right:var(--ac-gutter);top:calc(var(--hdr) + (100vh - var(--hdr)) / 2);transform:translateY(-50%);display:flex;flex-direction:column;gap:5px}
.step{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 16px 0 6px;border-radius:999px;border:1px solid rgb(var(--ac-border));background:rgb(var(--ac-surface)/.9);backdrop-filter:blur(8px);cursor:pointer;font:600 13px Montserrat,sans-serif;color:rgb(var(--ac-muted));text-align:left;transition:all .25s}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 11px "IBM Plex Mono",monospace;background:rgb(var(--ac-bg));color:rgb(var(--ac-ink))}
.step:hover{color:rgb(var(--ac-ink))}
.step.on{background:#111;border-color:#111;color:#fff}
.step.on .n{background:rgb(var(--ac-accent));color:#fff}
.step.soon{opacity:.45;cursor:default}

/* progreso */
#prog{position:fixed;z-index:10;left:var(--ac-gutter);right:var(--ac-gutter);bottom:calc(var(--ac-gutter) - 4px);height:4px;border-radius:99px;background:rgb(var(--ac-border));overflow:hidden}
#prog-fill{height:100%;background:rgb(var(--ac-accent));transform-origin:0 50%;transform:scaleX(0)}
#hint{position:fixed;z-index:10;right:var(--ac-gutter);bottom:calc(var(--ac-gutter) + 8px);font:500 11px "IBM Plex Mono",monospace;color:rgb(var(--ac-muted));letter-spacing:.06em;text-transform:uppercase}
body.rec, body.rec *{cursor:none!important}
body.demo #hint{display:none!important}
/* ---- modo cine ---- */
body.demo #menu, body.demo #btn-labels, body.demo #btn-pause, body.demo #mode-pills{display:none!important}
.btn.play{border-color:rgb(var(--ac-accent));color:rgb(var(--ac-accent-text))}
.btn.play svg{fill:currentColor;stroke:none}
.btn.play:hover,.btn.play.on{background:rgb(var(--ac-accent));color:#fff}
#playChip{position:fixed;left:50%;bottom:calc(var(--ac-gutter) + 56px);transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:14px;background:#111;color:#fff;border:0;border-radius:999px;padding:10px 26px 10px 10px;cursor:pointer;text-align:left;box-shadow:0 14px 38px rgba(0,0,0,.24);transition:opacity .35s,transform .35s;-webkit-tap-highlight-color:transparent}
#playChip i{width:48px;height:48px;border-radius:50%;background:rgb(var(--ac-accent));display:grid;place-items:center;flex:0 0 auto}
#playChip i svg{width:20px;height:20px;margin-left:3px;fill:#fff}
#playChip{white-space:nowrap;width:max-content}
#playChip b{display:block;font:700 16px/1.2 Montserrat,sans-serif}
#playChip small{display:block;font:500 10px/1.4 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#b3b5b9;margin-top:3px}
#playChip.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
#demoExit{position:fixed;right:var(--ac-gutter);bottom:calc(var(--ac-gutter) + 22px);z-index:31;display:none;align-items:center;gap:8px;font:600 13px Montserrat,sans-serif;background:rgba(17,17,17,.78);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px)}
#demoExit svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none}
body.demo #demoExit{display:inline-flex}
body.rec #demoExit{display:none!important}
#cover{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .5s;padding:0 8vw;text-align:center}
body.cover #cover{opacity:1}
#cover .lg{width:min(220px,40vw);height:auto}
#cover h1{font-weight:800;font-size:clamp(34px,6vw,72px);letter-spacing:-.045em;line-height:1.02}
#cover h1 em{font-style:normal;color:rgb(var(--ac-accent-text))}
#cover p{font:500 clamp(11px,1.4vw,16px) "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:rgb(var(--ac-muted))}
body.paused #hint::after{content:" · arrastra para rotar · rueda para acercar"}

@media (max-width:1023px){ .ac-util{display:none} :root{--hdr:66px} }
/* tablet */
@media (max-width:1100px){
  .ac-name small{display:none}
  #menu{top:calc(var(--hdr) + 12px);transform:none;flex-direction:row;left:var(--ac-gutter);right:var(--ac-gutter);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  #menu::-webkit-scrollbar{display:none}
  .step{flex:none} .step .t{display:none} .step.on .t{display:inline} .step{padding:0 6px}
  .step.on{padding-right:14px}
  .btn span{display:none} .btn{padding:0 12px}
  #hint{display:none}
  #stage-card{left:var(--ac-gutter);right:var(--ac-gutter);width:auto;max-width:560px}
}
/* celular (vertical o girado) */
@media (max-width:700px), (max-height:520px){
  :root{--hdr:56px;--ac-gutter:12px}
  .ac-bar{height:56px;gap:8px}
  .ac-bar .lg{height:22px}
  .ac-name strong{font-size:17px}
  .ac-name small{display:none}
  #mode-pills{margin-left:4px;padding:2px}
  #mode-pills button{height:32px;padding:0 11px;font-size:12px}
  .btn{height:38px;padding:0 10px}
  .btn span{display:none}
  #hint{display:none}
  .step{min-height:32px} .step .n{width:24px;height:24px;font-size:10px}
  #stage-card{bottom:16px;padding:14px 16px;gap:8px;border-radius:20px;max-width:none}
  #st-kicker{font-size:10.5px}
  #st-title{font-size:22px}
  #st-text{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  #stage-card.open #st-text{-webkit-line-clamp:unset;display:block}
  #st-data{gap:6px}
  .mini{padding:8px 9px;border-radius:12px}
  .mini b{font-size:17px}
  .mini span{font-size:10px;margin-top:4px}
  #prog{bottom:6px;height:3px}
  .lbl span{font-size:9.5px;padding:3px 7px}
}
@media (max-width:380px){ .ac-name{display:none} }
@media (max-width:700px){
  #playChip{bottom:auto;top:46%;padding:10px 22px 10px 10px}
  #demoExit{bottom:auto;top:calc(var(--hdr) + 12px);right:12px}
}
@media (max-height:520px) and (orientation:landscape){
  #playChip{top:auto;left:auto;right:16px;bottom:16px;transform:none}
  #playChip.hide{transform:translateY(12px)}
  #demoExit{top:calc(var(--hdr) + 10px);bottom:auto;right:12px}
}
/* pantallas bajas en horizontal (celular girado) */
@media (max-height:520px) and (orientation:landscape){
  .ac-util{display:none} :root{--hdr:52px}
  .ac-bar{height:52px}
  #menu{left:auto;max-width:55vw}
  #stage-card{width:330px;right:auto;bottom:12px;padding:12px 14px;gap:6px}
  #st-title{font-size:20px}
  #st-text{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini b{font-size:16px}
}
